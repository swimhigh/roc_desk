[workspace]
resolver = "2"
members = ["src-tauri", "protocol", "agent"]

# `src-tauri` 是现有客户端 crate（roc_desk.exe），`protocol`/`agent` 是新增的
# Windows 远程 Agent 方案（AGENT_DESIGN.md）：`protocol` 是客户端与 Agent 共享的
# 纯数据协议 crate，`agent` 产出独立部署在远程 Windows 服务器上的 roc_desk_agent.exe。
# 三者放进同一个 workspace 只是为了共用一份 Cargo.lock/依赖解析缓存，不代表
# roc_desk.exe 运行时依赖 agent crate——`src-tauri` 只依赖 `protocol`。
#
# 2026-09：曾经这里还有一个 `codex-engine` member（深度嵌入 OpenAI Codex，见
# docs/CODEX_INTEGRATION_PLAN.md），连带 `vendor/codex` git submodule 和下面这段
# `[patch.crates-io]`。实测发现 codex-core 的 `apply_patch` 在远程目标下不经过
# roc_desk 自己的确认/撤销状态机，可信度不达标，已经整体回退并删除，改成老引擎
# 自己支持 Responses API（`src-tauri/src/coding/session.rs`）。
