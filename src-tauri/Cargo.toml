[package]
name = "roc_desk"
version = "1.1.3"
description = "roc_desk — integrated developer client (SSH/SFTP/log search/AI)"
authors = ["you"]
edition = "2021"
license-file = "../LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roc_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" 用于 browser 模块的内嵌子 WebView（`Window::add_child`/`Manager::get_webview`/
# `Manager::get_window`），网页浏览面板需要把网页内容定位到主窗口内的一块矩形区域里
# 而不是弹出独立窗口（2026-08-18 需求变更，见 src/browser/mod.rs 顶部注释）。
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = "2"
anyhow = "1"

# 异步
tokio = { version = "1", features = ["rt-multi-thread", "fs", "process"] }
async-trait = "0.1"

# 数据库（工作区档案持久化，CODE_DESIGN.md §五）
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 落盘日志（lib.rs::init_logging）：windows_subsystem = "windows" 的发布版没有控制台，
# tracing_subscriber::fmt::init() 只写 stdout 等于日志直接消失——panic/异常发生时
# 除了崩溃窗口消失什么都留不下（2026-08-28 用户反馈"程序有可能会自动退出不见了"）。
tracing-appender = "0.2"

# 其他
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# 凭据存储（系统密钥链，DESIGN.md §八-1）
keyring = { version = "3", features = ["windows-native"] }

# SSH / SFTP
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2"

# Windows 远程 Agent（AGENT_DESIGN.md）：客户端与 roc_desk_agent.exe 共享的协议
# 类型 + 帧编解码；TLS 用法和 agent/Cargo.toml 保持一致（显式 `ring`，
# 避免 `aws-lc-rs` 构建脚本在部分 Windows 环境下的"拒绝访问"问题）。
roc_desk_protocol = { path = "../protocol" }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
sha2 = "0.10"

# 本地终端 PTY（DESIGN.md §3.2，本地工作区的终端面板；Windows 上底层走 ConPTY）
portable-pty = "0.8"

# 日志行解析 / 高危命令黑名单匹配
regex = "1"

# 文本文件编码探测（Windows 上大量 .txt/.log 是 GBK 或带 BOM 的 UTF-16，
# 不能假设全是 UTF-8，见 fsops::encoding）
encoding_rs = "0.8"

# AI 对话（OpenAI 兼容 API，SSE 流式，DESIGN.md §3.6）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

# AI 编程助手：文件变更 Diff 生成（DESIGN.md §3.8.3）
similar = "2"

# 编辑器图片预览：整份读入的二进制编码成 base64 交给前端拼 data URL 展示
# （2026-08-28 用户反馈图片在编辑器里被当文本打开、显示一堆乱码）。
base64 = "0.22"

# 解析 EXE/DLL（PE）、SO（ELF）等可执行文件的基本信息与依赖库列表（2026-08-28
# 需求：打开这类不可编辑的可执行文件时直接展示这些信息，而不是尝试当文本打开）。
# 纯 Rust 实现，只读取头部结构，不加载/执行文件本身。
goblin = "0.9"

# 解析 JAR 包（本质是 ZIP + META-INF/MANIFEST.MF，2026-08-28 需求：查看 JAR 的
# 基本信息/依赖库列表 + 内部条目）。只开 "deflate"——JAR 里绝大多数条目要么不压缩
# （STORED）要么用标准 Deflate，不需要 bzip2/zstd/lzma 这些少见编解码器拖累编译时间。
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# RDP（远程工具模式，DESIGN.md §3.9）：不自己实现协议——依次踩了 rustls 套件受限、
# IronRDP 不支持会话选择界面、ActiveX 承载 `mstscax.dll` 控件时 `Connect()` 总是
# 同步自我拒绝且始终没能定位到根因几个坑（详见 src/rdp/mod.rs 顶部注释），最终
# 落地在拉起系统自带的 `mstsc.exe`、用 Win32 API 把它的窗口摘掉标题栏/边框、
# `SetParent` 挪进 roc_desk 主窗口。`Win32_Foundation`/`Win32_UI_WindowsAndMessaging`
# 是这条路径本身需要的 API 面；`Win32_Graphics_Gdi` 是 `RedrawWindow` 需要的——
# 真机联调发现跨进程 `SetParent` 之后硬件加速渲染的窗口（现代 mstsc.exe 用
# DirectX/DXGI 画桌面画面）经常不会正确挂到新宿主的合成表面上，窗口本身的位置/
# 大小/可见性这些属性完全正常但内容是黑的，`embed_window` 里用尺寸抖动+强制重绘
# 应对这类问题。版本对齐 tauri 自己内部依赖的 windows crate（见 tauri 2.11.5 的
# Cargo.toml `[target."cfg(windows)".dependencies.windows]`），这样
# `tauri::WebviewWindow::hwnd()` 返回的 HWND 类型能直接互操作，不用做类型转换。
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
