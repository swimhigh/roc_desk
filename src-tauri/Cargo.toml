[package]
name = "roc_desk"
version = "3.0.0"
description = "roc_desk — integrated developer client (SSH/SFTP/log search/AI)"
authors = ["you"]
edition = "2021"
license-file = "../LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roc_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri = { version = "2", features = ["unstable"] }

[dependencies]
roc_desk_core = { git = "https://github.com/swimhigh/roc_desk-common", package = "roc_desk_core", tag = "common-v0.2.2" }
roc_desk_common = { git = "https://github.com/swimhigh/roc_desk-common", package = "roc_desk_common", tag = "common-v0.2.2" }
# "unstable" 用于 browser 模块的内嵌子 WebView（`Window::add_child`/`Manager::get_webview`/
# `Manager::get_window`），网页浏览面板需要把网页内容定位到主窗口内的一块矩形区域里
# 而不是弹出独立窗口（2026-08-18 需求变更，见 src/browser/mod.rs 顶部注释）。
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Windows"用...打开"文件关联/双击已关联文件时，系统是把文件路径当命令行参数
# 拉起一个新进程——如果 roc_desk 已经在运行，需要把这个新进程的 argv 转发给
# 已有实例（在已有窗口里开一个新标签），而不是真的再起一个进程（2026-09-03 需求）。
tauri-plugin-single-instance = "2"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP 桌面（docs/HTTP_DESKTOP_PLAN.md §4.4）：请求/集合/环境定义文件用 YAML。
# 上游 `serde_yaml` 已被作者存档（不再接新功能），但没有已知安全问题、生态里
# 仍被广泛依赖，用于读写本地/工作区内的配置文件足够稳；如果后续需要积极维护的
# 替代品，可以平替成 `serde_yaml_ng`（同一套 API）。
serde_yaml = "0.9"

# 错误处理
thiserror = "2"
anyhow = "1"

# 异步
tokio = { version = "1", features = ["rt-multi-thread", "fs", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"

# 数据库（工作区档案持久化，CODE_DESIGN.md §五）
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.34"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 落盘日志（lib.rs::init_logging）：windows_subsystem = "windows" 的发布版没有控制台，
# tracing_subscriber::fmt::init() 只写 stdout 等于日志直接消失——panic/异常发生时
# 除了崩溃窗口消失什么都留不下（2026-08-28 用户反馈"程序有可能会自动退出不见了"）。
tracing-appender = "0.2"

# 其他
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# 凭据存储（系统密钥链，DESIGN.md §八-1）
keyring = { version = "3", features = ["windows-native"] }

# SSH / SFTP
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2"

# Windows 远程 Agent（AGENT_DESIGN.md）：客户端与 roc_desk_agent.exe 共享的协议
# 类型 + 帧编解码；TLS 用法和 agent/Cargo.toml 保持一致（显式 `ring`，
# 避免 `aws-lc-rs` 构建脚本在部分 Windows 环境下的"拒绝访问"问题）。
roc_desk_protocol = { path = "../protocol" }

tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
sha2 = "0.10"

# 本地终端 PTY（DESIGN.md §3.2，本地工作区的终端面板；Windows 上底层走 ConPTY）
portable-pty = "0.8"

# 日志行解析 / 高危命令黑名单匹配
regex = "1"

# 文本文件编码探测（Windows 上大量 .txt/.log 是 GBK 或带 BOM 的 UTF-16，
# 不能假设全是 UTF-8，见 fsops::encoding）
encoding_rs = "0.8"

# AI 对话（OpenAI 兼容 API，SSE 流式，DESIGN.md §3.6）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"

# AI 编程助手：文件变更 Diff 生成（DESIGN.md §3.8.3）
similar = "2"

# 编辑器图片预览：整份读入的二进制编码成 base64 交给前端拼 data URL 展示
# （2026-08-28 用户反馈图片在编辑器里被当文本打开、显示一堆乱码）。
base64 = "0.22"

# 解析 EXE/DLL（PE）、SO（ELF）等可执行文件的基本信息与依赖库列表（2026-08-28
# 需求：打开这类不可编辑的可执行文件时直接展示这些信息，而不是尝试当文本打开）。
# 纯 Rust 实现，只读取头部结构，不加载/执行文件本身。
goblin = "0.9"

# 解析 JAR 包（本质是 ZIP + META-INF/MANIFEST.MF，2026-08-28 需求：查看 JAR 的
# 基本信息/依赖库列表 + 内部条目）。只开 "deflate"——JAR 里绝大多数条目要么不压缩
# （STORED）要么用标准 Deflate，不需要 bzip2/zstd/lzma 这些少见编解码器拖累编译时间。
# 也是 Skills 导入支持 .zip 压缩包（`coding::skills` 模块）复用的同一个 crate。
zip = { version = "2", default-features = false, features = ["deflate"] }

# Skills 导入支持 .tar.gz/.tgz 压缩包——`tar` 解包 + `flate2` 解 gzip，都是纯 Rust
# 实现，不依赖系统装没装 tar/gzip；`flate2` 本来就是 `zip` 的 deflate 后端会拉进来
# 的传递依赖，这里提升成直接依赖只是为了能在代码里直接 `use`。RAR 格式故意不支持
# （2026-09 用户决定）：没有靠谱的纯 Rust 解压库，要支持只能调用系统装的 WinRAR/
# 7-Zip 或者打包一份 unrar 可执行文件进便携版——Skills 包从来不会用 RAR 分发
# （GitHub/Claude Skills 市场只出 zip/tar.gz），为这个概率极低的场景增加外部依赖
# 不划算。
tar = "0.4"
flate2 = "1"

# SQL 桌面模块（docs/SQL_DESKTOP_PLAN.md）驱动选型：
#
# 故意不用 `sqlx` 门面 crate——`sqlx` 无条件在 Cargo.toml 里声明一条
# （即使不启用 "sqlite" feature 也存在的）`sqlx-sqlite`（optional）依赖边，
# 而 `sqlx-sqlite` 又 `links = "sqlite3"`，和项目本来就在用的
# `rusqlite`/`r2d2_sqlite`（同样 `links = "sqlite3"`，但版本号区间完全不重叠：
# rusqlite 0.39 要 `libsqlite3-sys ^0.37`，sqlx-sqlite 0.8.6 要 `^0.30.1`）
# 在 Cargo 的"一个 links 值全图只能有一个版本"规则下直接冲突、resolve 失败
# （`cargo check` 实测报错，不是猜测）——即便业务代码完全不会触发 sqlite 分支，
# Cargo.lock 仍然要为这条未激活的 optional 依赖边选定一个版本。改用各数据库
# 各自独立的驱动 crate（都不含 sqlite 依赖，天然不会撞车），顺带也让每种数据库
# 的 API 更贴合自己的协议特性，不用套 sqlx 的统一泛型 Row/Column 抽象。
#
# PostgreSQL：`tokio-postgres` 是 rust-postgres 项目的官方异步驱动；openGauss
# 走同一个 crate（PG 线协议兼容，方言差异封装在 `sql::adapters::opengauss`，
# 见方案 4.3），不需要单独的驱动。`deadpool-postgres` 提供连接池，池大小
# 上限对齐 4.4 节参考 rainfrog 的建议（每数据源默认给个保守上限）。
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
# TLS 用 rustls + ring provider，和项目里 tokio-rustls/rustls 已经在用的 ring
# 保持一致，避免同时存在 aws-lc-rs 和 ring 两套加密后端。
tokio-postgres-rustls = "0.14"
deadpool-postgres = "0.14"
# TLS 根证书用系统证书库而不是 Mozilla 内置列表——内网自建 PostgreSQL/openGauss
# 常见做法是把自签 CA 导入 Windows 证书存储，走系统证书库才认得到；不做
# "跳过校验"（方案 §7 明确禁止默认关闭证书校验）。
rustls-native-certs = "0.8"

# MySQL：`mysql_async` 是社区维护最活跃的异步 MySQL 驱动，自带连接池
# （`mysql_async::Pool`），TLS 同样选 ring provider（`default-rustls-ring`
# feature 组合），不需要额外引入连接池 crate。
mysql_async = { version = "0.37", default-features = false, features = [
    "default-rustls-ring",
    "chrono",
] }

# SQL Server：纯 Rust 实现的 TDS 协议客户端，不依赖系统装 ODBC/FreeTDS。
# `tiberius::Client::connect` 吃裸 `tokio::net::TcpStream`，要用 `tokio_util::
# compat` 把它适配成 tiberius 依赖的 futures-io 风格 AsyncRead/AsyncWrite——
# 上面 `tokio-util` 已经加了 "compat" feature，不需要再单独引一份。
tiberius = { version = "0.12", default-features = false, features = [
    "rustls",
    "chrono",
    "tds73",
] }
# tiberius 本身不带连接池，`bb8-tiberius` 提供 `bb8::ManageConnection` 适配。
bb8 = "0.9"
bb8-tiberius = { version = "0.16", default-features = false, features = ["with-tokio"] }

# 危险 SQL 判定走 AST 分类而不是正则（docs/SQL_DESKTOP_PLAN.md §7，参考
# rainfrog 的实现思路）。
sqlparser = "0.52"
pdf-extract = "0.12.1"

[target.'cfg(windows)'.dependencies]
# RDP（远程工具模式，DESIGN.md §3.9）：不自己实现协议——依次踩了 rustls 套件受限、
# IronRDP 不支持会话选择界面、ActiveX 承载 `mstscax.dll` 控件时 `Connect()` 总是
# 同步自我拒绝且始终没能定位到根因几个坑（详见 src/rdp/mod.rs 顶部注释），最终
# 落地在拉起系统自带的 `mstsc.exe`、用 Win32 API 把它的窗口摘掉标题栏/边框、
# `SetParent` 挪进 roc_desk 主窗口。`Win32_Foundation`/`Win32_UI_WindowsAndMessaging`
# 是这条路径本身需要的 API 面；`Win32_Graphics_Gdi` 是 `RedrawWindow` 需要的——
# 真机联调发现跨进程 `SetParent` 之后硬件加速渲染的窗口（现代 mstsc.exe 用
# DirectX/DXGI 画桌面画面）经常不会正确挂到新宿主的合成表面上，窗口本身的位置/
# 大小/可见性这些属性完全正常但内容是黑的，`embed_window` 里用尺寸抖动+强制重绘
# 应对这类问题。版本对齐 tauri 自己内部依赖的 windows crate（见 tauri 2.11.5 的
# Cargo.toml `[target."cfg(windows)".dependencies.windows]`），这样
# `tauri::WebviewWindow::hwnd()` 返回的 HWND 类型能直接互操作，不用做类型转换。
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
windows-future = { version = "0.2.1", features = ["std"] }
